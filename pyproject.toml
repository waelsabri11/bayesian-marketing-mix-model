[project]
name = "mmm"
version = "0.1.0"
description = "Bayesian Marketing Mix Model with PyMC: adstock, saturation, lift-test calibration, budget optimisation"
readme = "README.md"
authors = [
    { name = "Wael Sabri", email = "waelsabri4@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pymc>=6.3.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
]

[project.scripts]
mmm-run = "mmm.pipeline:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
